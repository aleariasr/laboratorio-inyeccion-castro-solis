<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>LICS</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: "Segoe UI", -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #334155;
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  h1 {
    font-weight: 600;
    letter-spacing: 0.08em;
    margin: 0 0 8px 0;
  }
  #status {
    font-size: 14px;
    color: #94a3b8;
    max-width: 520px;
    text-align: center;
    white-space: pre-wrap;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="spinner"></div>
  <h1>LICS</h1>
  <div id="status">Iniciando...</div>
  <script>
    window.lics.onStatus((text) => {
      document.getElementById('status').textContent = text;
    });
  </script>
</body>
</html>
